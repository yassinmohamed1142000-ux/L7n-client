# Memory for the Gradle daemon. Minecraft's one-time setup steps (decompile, index) need some headroom.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------------------------------------------
# Versions. See BUILD.md before changing any of them.
#
# The three game-side versions are exactly the minimums that fabric.mod.json declares (fabricloader >=0.18.4,
# fabric-api >=0.145.4, minecraft ~26.1), so the jar is compiled against the oldest thing it claims to run on.
# Loader 0.18.4, Loom 1.15.x and Gradle 9.4 are the combination Fabric API's own 26.1.2 branch builds with.
# To target another 26.1.x patch, pick the matching Fabric API build at https://modrinth.com/mod/fabric-api/versions
# (for plain 26.1: minecraft_version=26.1 and fabric_api_version=0.145.1+26.1).
# ---------------------------------------------------------------------------------------------------------------
minecraft_version=26.1.2
loader_version=0.18.4
fabric_api_version=0.145.4+26.1.2
loom_version=1.15.5

# Mod
mod_version=2.0.0
maven_group=com.reaper
archives_base_name=reaper-client
