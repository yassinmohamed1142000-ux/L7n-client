// ./gradlew coreTests
//
// Runs the tests of everything in com.reaper.client.core: modules, settings, config and profiles, the ClickGUI and HUD
// models (drawn onto a headless canvas), waypoints, screenshots, the inventory sorter, chat tools, commands and the
// wiring of all of it. No Minecraft is started, and only the core is compiled for this, so these tests do not depend on
// the game layer (com.reaper.client.mc / .mixin) compiling.
//
// This is deliberately not part of `build` or `check`: producing the jar must never fail because of a test.
//
//   ./gradlew coreTests                         run every suite
//   ./gradlew coreTests --args="Gui Wiring"     run only some (see AllTests for the names)

// The test classes are plain main() programs, not JUnit tests, and the two tasks below compile and run them. Gradle's
// own `compileTestJava` and `test` would otherwise compile src/test/java a second time during `build`, on a class path
// that only the real game build can vouch for. Switching them off means `build` cannot fail because of a test.
tasks.matching { it.name == 'compileTestJava' || it.name == 'test' }.configureEach { enabled = false }

def coreTestClasses = layout.buildDirectory.dir('core-tests/classes')

def compileCoreTests = tasks.register('compileCoreTests', JavaCompile) {
    group = 'verification'
    description = 'Compiles the Minecraft-free core together with the test harness.'
    source(fileTree(dir: 'src/main/java', include: 'com/reaper/client/core/**/*.java'))
    source(fileTree(dir: 'src/test/java', include: '**/*.java'))
    classpath = sourceSets.main.compileClasspath          // Gson comes with the game's own libraries
    destinationDirectory = coreTestClasses
    options.encoding = 'UTF-8'
}

tasks.register('coreTests', JavaExec) {
    group = 'verification'
    description = 'Runs the Minecraft-free core tests (no game needed).'
    dependsOn compileCoreTests
    classpath = files(coreTestClasses) + sourceSets.main.compileClasspath
    mainClass = 'com.reaper.client.tests.AllTests'
    systemProperty 'java.awt.headless', 'true'
    // The GUI and HUD tests write PNG renders of what they drew here, to look at.
    systemProperty 'reaper.preview.dir', layout.buildDirectory.dir('previews').get().asFile.path
}
